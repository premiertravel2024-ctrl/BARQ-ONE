launcher:
  enabled: true
  apps: true
  files: true
  folders: true
  sites: true
  max_file_index: 20000
  max_depth: 5
  max_candidates: 4
  min_score: 0.84
  min_gap: 0.12
  approval_seconds: 60
  launches_per_minute: 6
  voice_enabled: true
  stt: gemini
  local_stt_installed: false
  speak_confirmation: 'off'
  hide_paths_in_audit: true
  indexing_on_startup: false
  # Search roots are resolved using Windows Known Folders.
  extra_roots: []
