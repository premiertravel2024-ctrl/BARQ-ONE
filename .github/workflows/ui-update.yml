name: BARQ - compact UI-only update

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/public/**'
      - 'frontend/index.html'
      - 'frontend/vite.config.ts'
      - 'frontend/package*.json'
      - 'scripts/installer_ui_update.iss'
      - '.github/workflows/ui-update.yml'

permissions:
  contents: read

concurrency:
  group: barq-ui-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ui:
    name: Compile and validate frontend patch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Validate React contract and typecheck
        working-directory: frontend
        run: |
          npm run test:frontend
          npm run build
      - name: Verify fresh update assets
        run: |
          test -s web/react/index.html
          test -s web/react/audio/live-capture.js
          grep -l 'v2.41.30-build-gated-ui' web/react/assets/*.js
          test "$(find web/react/assets -name '*.js' -type f | wc -l)" -ge 1
      - name: Publish compiled UI for patch packaging
        uses: actions/upload-artifact@v4
        with:
          name: BARQ-UI-compiled-intermediate
          path: web/react
          if-no-files-found: error
          retention-days: 3

  package-ui:
    name: Package frontend-only Windows UI update
    needs: validate-ui
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BARQ-UI-compiled-intermediate
          path: web/react
      - name: Verify packaged UI completeness
        shell: pwsh
        run: |
          if (!(Test-Path "web/react/index.html")) { throw 'Missing compiled UI index' }
          if (!(Test-Path "web/react/audio/live-capture.js")) { throw 'Missing voice worklet' }
          if (!(Get-ChildItem "web/react/assets" -Filter "*.js")) { throw 'Missing JS output' }
      - name: Install Inno Setup 6 compiler
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build compact update without Python runtime or models
        shell: pwsh
        run: |
          $compiler = & ./scripts/find_inno.ps1
          if ([string]::IsNullOrWhiteSpace($compiler) -or !(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Inno compiler unavailable: $compiler" }
          Write-Host "Using Inno compiler at $compiler"
          & $compiler ./scripts/installer_ui_update.iss
          if ($LASTEXITCODE -ne 0) { throw 'UI-only compilation failed' }
          $result = 'release/BARQ_UI_Update_2.41.30.exe'
          if (!(Test-Path $result)) { throw 'Missing compact UI update installer' }
          $size = (Get-Item $result).Length
          if ($size -gt 75MB) { throw "The UI update is too large: $size bytes" }
          $sum = (Get-FileHash $result -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sum  BARQ_UI_Update_2.41.30.exe" | Set-Content release/BARQ_UI_Update_2.41.30.sha256 -Encoding ascii
          Write-Host "BARQ UI patch built; $size bytes; SHA256 $sum"
      - name: Upload verified compact update
        uses: actions/upload-artifact@v4
        with:
          name: BARQ-v2.41.30-UI-only-update
          path: |
            release/BARQ_UI_Update_2.41.30.exe
            release/BARQ_UI_Update_2.41.30.sha256
          if-no-files-found: error
          retention-days: 30
