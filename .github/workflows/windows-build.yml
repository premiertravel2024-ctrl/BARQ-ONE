name: BARQ — verified frontend and Windows installer
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
# Every PR synchronize event previously started three heavy jobs, often
# building the same branch dozens of times. Keep only the latest revision.
# Never cancel pushes to main or release tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  frontend-validation:
    name: React strict build gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Cloudflare room server module syntax
        working-directory: .
        run: |
          node --check cloudflare/worker.mjs
          node --test cloudflare/worker.test.mjs
      - name: Verify cross-file release metadata before installing dependencies
        working-directory: .
        run: python3 scripts/verify_release_consistency.py
      - name: Validate source archive completeness and local React imports
        working-directory: .
        run: python3 scripts/verify_source_integrity.py
      - name: Validate native installer dependencies in workflow
        working-directory: .
        run: python3 scripts/verify_ci_dependencies.py
      - name: Install EXACT locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test catalogue, music metadata and native wallpaper routing
        working-directory: .
        run: |
          python3 -m pip install pytest fastapi httpx mutagen "cryptography>=42,<51"
          python3 -m pytest -q tests/test_cinema_music_rebuild.py tests/test_room_player_fullscreen.py tests/test_ui_upgrade_v22.py tests/test_app_context.py tests/test_reading_editions.py tests/test_app_updates.py
      - name: Verify media UI behavior on desktop and mobile
        run: |
          npx playwright install chromium
          # Hosted runners normally include browser libraries. Check them before
          # invoking apt, whose optional font downloads can stall on a mirror.
          if ! node -e "require('playwright').chromium.launch({headless:true,args:['--no-sandbox']}).then(b=>b.close()).catch(e=>{console.error(e);process.exit(1)})"; then
            npx playwright install-deps chromium
          fi
          npm run dev > /tmp/barq-vite.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/tests/rebuild/index.html > /dev/null && break; sleep 1; done
          npm run test:media-ui
      - name: Upload media UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BARQ-media-UI-checks
          path: frontend/test-results
          if-no-files-found: warn
      - name: Run frontend backend-adapter behavior tests
        run: npm run test:frontend
      - name: Verify audio recovery under simulated desktop conditions
        working-directory: .
        run: |
          node tests-js/live_voice_roundtrip.cjs
          node tests-js/live_voice_crash_regression.cjs
          node tests-js/voice_task_handoff.cjs
      - name: Test the import checker
        run: npm run test:imports
      - name: Verify real lucide-react exports and compile React
        run: npm run build
      - name: Verify the built audio worklet
        working-directory: .
        run: cmp frontend/public/audio/live-capture.js web/react/audio/live-capture.js
      - name: Chat coordination smoke test
        run: npm run test:chat
      - name: Approval and continuation behavior
        run: npm run test:approvals
      - name: Test workspace synchronization
        working-directory: frontend
        run: npm run test:workspace
      - name: Upload freshly compiled React build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BARQ-React-build-diagnostics
          path: web/react
          if-no-files-found: error
          retention-days: 7
  windows-early-regressions:
    name: Fast Windows file-sharing and cleanup verification
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install isolated test prerequisites
        run: python -m pip install 'pytest>=8,<10'
      - name: Check consent-gated local content search on Windows
        run: python -m pytest -q tests/test_content_index_optin.py tests/test_device_index_first_search_recovery.py
      - name: Exercise SQLite cleanup under real Windows sharing rules
        run: python -m pytest -v tests/test_v2182_sqlite_lifecycle.py -k "selftest_cleanup"
      - name: Validate GitHub ZIP names using actual Windows path semantics
        run: python -m pytest -q tests/test_github_repository_import_v230.py -k "zip_rejects or zip_symlink"
  windows-x64:
    name: Native Windows installer verification
    needs: [frontend-validation, windows-early-regressions]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Embed the trusted desktop update channel
        if: vars.BARQ_UPDATE_ORIGIN != '' || vars.BARQ_UPDATE_PUBLIC_KEY != ''
        env:
          BARQ_UPDATE_ORIGIN: ${{ vars.BARQ_UPDATE_ORIGIN }}
          BARQ_UPDATE_PUBLIC_KEY: ${{ vars.BARQ_UPDATE_PUBLIC_KEY }}
        shell: pwsh
        run: |
          python -m pip install "cryptography>=42,<51" "httpx>=0.27,<1"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m scripts.publish_update configure
      - name: Fetch and verify the speaker recognition model
        shell: pwsh
        run: |
          $model = 'models/speaker/wespeaker_en_voxceleb_resnet34_LM.onnx'
          $expected = 'e9848563da86f263117134dfd7ad63c92355b37de492b55e325400c9d9c39012'
          if (!(Test-Path $model)) {
            $sources = @(
              'https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx',
              'https://huggingface.co/anujpatel863/Separate/resolve/c9b28337a09ccbf537f811a12ef2ee79b521c881/wespeaker_en_voxceleb_resnet34_LM.onnx'
            )
            foreach ($source in $sources) {
              curl.exe --fail --silent --show-error --location --retry 2 --max-time 120 --output "$model.download" $source
              if ($LASTEXITCODE -eq 0 -and (Get-FileHash "$model.download" -Algorithm SHA256).Hash -eq $expected) {
                Move-Item "$model.download" $model
                break
              }
              Remove-Item "$model.download" -ErrorAction SilentlyContinue
            }
          }
          if (!(Test-Path $model) -or (Get-FileHash $model -Algorithm SHA256).Hash -ne $expected) {
            throw 'Speaker model is missing or its SHA-256 does not match'
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Verify incremental Core+UI extraction contract before building
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_restore_verified_core.py
      - name: Check Windows policy regression and protected staging paths
        shell: pwsh
        run: |
          py -3.11 -m pip install -r requirements-test.txt
          py -3.11 -m pytest -q tests/test_computer_control_cognition_v230.py -k "anchored_ui_safety_and_approval or staged_appdata_working_directory_stays_protected"
      - name: Build React, run tests, package Windows EXE and perform binary self-test
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify EXACT outputs from THIS run
        shell: pwsh
        run: |
          $releaseVersion = '2.41.12'
          $prefix = "release/BARQ_Setup_$releaseVersion.exe"
          if (!(Test-Path $prefix)) { throw 'Missing freshly built installer' }
          if (!(Test-Path "release/BARQ_Portable_$releaseVersion.zip")) { throw 'Missing portable ZIP' }
          $marker = "release/build-ok-v$releaseVersion.marker"
          if (!(Test-Path $marker)) { throw 'Missing verified build marker' }
          if (-not ((Get-Content $marker -Raw) -match 'fresh-react')) { throw 'Stale or recovery UI blocked' }
          $report = Get-Content 'release/self-test.json' -Raw | ConvertFrom-Json
          $installed = Get-Content 'release/installed-self-test.json' -Raw | ConvertFrom-Json
          if ($installed.status -ne 'ok' -or $installed.version -ne $releaseVersion -or -not $installed.frozen) { throw 'Installed application smoke failed' }
          $evidence = Get-Content 'release/release-evidence.json' -Raw | ConvertFrom-Json
          foreach ($file in @($prefix, "release/BARQ_Portable_$releaseVersion.zip")) {
            $expected = $evidence.sha256.PSObject.Properties[$file].Value
            if ((Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() -ne $expected) { throw "Artifact checksum mismatch: $file" }
          }
          if ($report.status -ne 'ok' -or $report.ui -ne 'react' -or $report.frozen -ne $true) { throw 'Packaged executable smoke test failed' }
      - name: Package verified BARQ Core and UI incremental update
        shell: pwsh
        run: |
          $compiler = & ./scripts/find_inno.ps1
          if ([string]::IsNullOrWhiteSpace($compiler) -or !(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Inno compiler unavailable for incremental update' }
          # The short-path builder deliberately keeps only verified release artifacts
          # in the checkout and removes the temporary PyInstaller staging tree.
          # Restore the EXACT tested BARQ.exe from this run's portable ZIP, not a stale
          # or unrelated dist/ file. Verify both ZIP and executable SHA-256 first.
          py -3.11 scripts/restore_verified_core.py --with-ui --version 2.41.12
          if ($LASTEXITCODE -ne 0) { throw 'Unable to restore verified Core+UI from this run portable archive' }
          if (!(Test-Path 'dist/BARQ/BARQ.exe')) { throw 'Verified BARQ.exe missing after recovery' }
          if (!(Test-Path 'web/react/index.html')) { throw 'Verified React UI missing after recovery' }
          if (!(Test-Path 'web/react/audio/live-capture.js')) { throw 'Verified React worklet missing after recovery' }
          if (!(Get-ChildItem 'web/react/assets' -Filter '*.js' -ErrorAction Stop)) { throw 'Verified React JS assets missing after recovery' }
          & $compiler ./scripts/installer_core_ui_update.iss
          if ($LASTEXITCODE -ne 0) { throw 'Core/React update compilation failed' }
          $patch = 'release/BARQ_Core_UI_Update_2.41.12.exe'
          if (!(Test-Path $patch)) { throw 'Missing Core+UI patch installer' }
          $size = (Get-Item $patch).Length
          if ($size -gt 180MB) { throw "Unexpectedly large update: $size bytes" }
          $checksum = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  BARQ_Core_UI_Update_2.41.12.exe" | Set-Content release/BARQ_Core_UI_Update_2.41.12.sha256 -Encoding ascii
          Write-Host "Core+UI patch built, $size bytes, SHA256 $checksum"
      - name: Upload verified incremental Core+UI update
        uses: actions/upload-artifact@v4
        with:
          name: BARQ-v2.41.12-Core-and-UI-update
          path: |
            release/BARQ_Core_UI_Update_2.41.12.exe
            release/BARQ_Core_UI_Update_2.41.12.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BARQ-v2.41.12-Windows-diagnostics
          path: |
            release/*.log
            release/*.xml
            release/python-tests-failures.txt
            release/*self-test.json
            release/release-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload installer, portable app, and evidence
        id: upload-windows
        uses: actions/upload-artifact@v4
        with:
          name: BARQ-v2.41.12-verified-Windows-x64
          path: |
            release/BARQ_Setup_2.41.12.exe
            release/BARQ_Portable_2.41.12.zip
            release/self-test.json
            release/installed-self-test.json
            release/release-evidence.json
            release/build-ok-v2.41.12.marker
            release/UI_BUILD_MODE.txt
          if-no-files-found: error
          retention-days: 30
      - name: Download the published Windows artifact
        id: download-windows
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: BARQ-v2.41.12-verified-Windows-x64
          path: ${{ runner.temp }}/barq-published-artifact
      - name: Allow newly uploaded artifacts to propagate
        if: steps.download-windows.outcome == 'failure'
        shell: pwsh
        run: Start-Sleep -Seconds 15
      - name: Retry downloading the published Windows artifact
        if: steps.download-windows.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: BARQ-v2.41.12-verified-Windows-x64
          path: ${{ runner.temp }}/barq-published-artifact
      - name: Verify the installer in the published artifact
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload-windows.outputs.artifact-url }}
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'barq-published-artifact'
          $filename = 'BARQ_Setup_2.41.12.exe'
          $installer = Get-Item -LiteralPath (Join-Path $folder $filename)
          $evidence = Get-Content -LiteralPath (Join-Path $folder 'release-evidence.json') -Raw | ConvertFrom-Json
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $evidence.sha256.PSObject.Properties["release/$filename"].Value) {
            throw 'The downloaded installer SHA-256 differs from the release evidence'
          }
          $reader = [System.IO.BinaryReader]::new($installer.OpenRead())
          try {
            if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'Installer has no DOS header' }
            $reader.BaseStream.Position = 0x3c
            $reader.BaseStream.Position = $reader.ReadUInt32()
            if ($reader.ReadUInt32() -ne 0x00004550) { throw 'Installer has no Windows PE signature' }
          } finally {
            $reader.Dispose()
          }
          "Verified published installer: $filename ($($installer.Length) bytes), SHA-256 $hash"
          "Installer artifact: $env:ARTIFACT_URL"

  publish-app-update:
    name: Publish signed BARQ update
    if: vars.BARQ_UPDATE_ORIGIN != '' && (github.ref_type == 'tag' || github.ref == 'refs/heads/main')
    needs: windows-x64
    runs-on: ubuntu-latest
    concurrency:
      group: barq-stable-update-feed
      cancel-in-progress: false
    env:
      BARQ_UPDATE_ORIGIN: ${{ vars.BARQ_UPDATE_ORIGIN }}
      BARQ_UPDATE_PUBLIC_KEY: ${{ vars.BARQ_UPDATE_PUBLIC_KEY }}
      BARQ_R2_ACCOUNT_ID: ${{ vars.BARQ_R2_ACCOUNT_ID }}
      BARQ_R2_BUCKET: ${{ vars.BARQ_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identify the verified Windows artifact
        id: version
        run: |
          version="$(python -c 'from core.version import VERSION; print(VERSION)')"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "number=$version" >> "$GITHUB_OUTPUT"
      - name: Check whether this version needs publishing
        id: publish
        run: |
          python -m pip install "cryptography>=42,<51" "httpx>=0.27,<1"
          publish="$(python -m scripts.publish_update should-publish)"
          echo "needed=$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.publish.outputs.needed == 'true'
        with:
          name: BARQ-v${{ steps.version.outputs.number }}-verified-Windows-x64
          path: verified-windows
      - name: Sign verified Windows installer metadata
        if: steps.publish.outputs.needed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BARQ_UPDATE_PRIVATE_KEY: ${{ secrets.BARQ_UPDATE_PRIVATE_KEY }}
          BARQ_UPDATE_NOTES: ${{ vars.BARQ_UPDATE_NOTES }}
        run: |
          python -m scripts.publish_update sign --tag "$RELEASE_TAG"
      - name: Publish installer and manifest together on GitHub Releases
        if: steps.publish.outputs.needed == 'true' && startsWith(vars.BARQ_UPDATE_ORIGIN, 'https://github.com/')
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.BARQ_UPDATE_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          repo="${BARQ_UPDATE_ORIGIN%/}"
          repo="${repo#https://github.com/}"
          installer="BARQ_Setup_$VERSION.exe"
          if draft="$(gh release view "$RELEASE_TAG" --repo "$repo" --json isDraft --jq .isDraft)"; then
            if [ "$draft" = true ]; then
              gh release upload "$RELEASE_TAG" "verified-windows/$installer" verified-windows/latest.json --repo "$repo" --clobber
            fi
          else
            gh release create "$RELEASE_TAG" "verified-windows/$installer" verified-windows/latest.json \
              --repo "$repo" --draft --title "BARQ ONE $VERSION" --notes "Windows x64."
            draft=true
          fi
          if [ "$draft" = true ]; then
            gh release edit "$RELEASE_TAG" --repo "$repo" --draft=false --latest
          fi
          # GitHub can briefly serve the previous manifest after marking a release latest.
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --location --max-time 20 \
              "$BARQ_UPDATE_ORIGIN/releases/latest/download/latest.json" --output verified-windows/public-latest.json \
                && cmp -s verified-windows/latest.json verified-windows/public-latest.json; then
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then sleep 10; fi
          done
          echo "::error::The public update feed did not serve the expected signed manifest."
          exit 1
      - name: Upload versioned installer, then advertise it on R2
        if: steps.publish.outputs.needed == 'true' && !startsWith(vars.BARQ_UPDATE_ORIGIN, 'https://github.com/')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BARQ_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BARQ_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$BARQ_R2_BUCKET"
          [[ "$BARQ_R2_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]
          endpoint="https://$BARQ_R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          filename="BARQ_Setup_$VERSION.exe"
          path="releases/$VERSION/$filename"
          digest="$(sha256sum "verified-windows/$filename" | cut -d' ' -f1)"
          aws --endpoint-url "$endpoint" s3api put-object --bucket "$BARQ_R2_BUCKET" \
            --key "$path" --body "verified-windows/$filename" --if-none-match '*' \
            --metadata "sha256=$digest" --content-type application/octet-stream \
            --cache-control 'public,max-age=31536000,immutable' || \
            test "$(aws --endpoint-url "$endpoint" s3api head-object --bucket "$BARQ_R2_BUCKET" \
              --key "$path" --query 'Metadata.sha256' --output text)" = "$digest"
          curl --fail --silent --show-error --head --retry 4 --retry-all-errors \
            "${BARQ_UPDATE_ORIGIN%/}/$path"
          aws --endpoint-url "$endpoint" s3api put-object --bucket "$BARQ_R2_BUCKET" \
            --key latest.json --body verified-windows/latest.json --content-type application/json --cache-control no-store
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            "${BARQ_UPDATE_ORIGIN%/}/latest.json" --output verified-windows/public-latest.json
          cmp verified-windows/latest.json verified-windows/public-latest.json
