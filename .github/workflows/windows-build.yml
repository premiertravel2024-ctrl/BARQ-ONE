name: BARQ — verified frontend and Windows installer
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
# Every PR synchronize event previously started three heavy jobs, often
# building the same branch dozens of times. Keep only the latest revision.
# Never cancel pushes to main or release tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  frontend-validation:
    name: React strict build gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Cloudflare room server module syntax
        working-directory: .
        run: |
          node --check cloudflare/worker.mjs
          node --test cloudflare/worker.test.mjs
      - name: Verify cross-file release metadata before installing dependencies
        working-directory: .
        run: python3 scripts/verify_release_consistency.py
      - name: Validate source archive completeness and local React imports
        working-directory: .
        run: python3 scripts/verify_source_integrity.py
      - name: Validate native installer dependencies in workflow
        working-directory: .
        run: python3 scripts/verify_ci_dependencies.py
      - name: Install EXACT locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test catalogue, music metadata and native wallpaper routing
        working-directory: .
        run: |
          python3 -m pip install pytest fastapi httpx mutagen
          python3 -m pytest -q tests/test_cinema_music_rebuild.py
      - name: Verify media UI behavior on desktop and mobile
        run: |
          npx playwright install --with-deps chromium
          npm run dev > /tmp/barq-vite.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/tests/rebuild/index.html > /dev/null && break; sleep 1; done
          npm run test:media-ui
      - name: Upload media UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BARQ-media-UI-checks
          path: frontend/test-results
          if-no-files-found: warn
      - name: Run frontend backend-adapter behavior tests
        run: npm run test:frontend
      - name: Verify audio recovery under simulated desktop conditions
        working-directory: .
        run: |
          node tests-js/live_voice_roundtrip.cjs
          node tests-js/live_voice_crash_regression.cjs
          node tests-js/voice_task_handoff.cjs
      - name: Test the import checker
        run: npm run test:imports
      - name: Verify real lucide-react exports and compile React
        run: npm run build
      - name: Verify the built audio worklet
        working-directory: .
        run: cmp frontend/public/audio/live-capture.js web/react/audio/live-capture.js
      - name: Chat coordination smoke test
        run: npm run test:chat
      - name: Approval and continuation behavior
        run: npm run test:approvals
      - name: Test workspace synchronization
        working-directory: frontend
        run: npm run test:workspace
      - name: Upload freshly compiled React build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BARQ-React-build-diagnostics
          path: web/react
          if-no-files-found: error
          retention-days: 7
  windows-early-regressions:
    name: Fast Windows file-sharing and cleanup verification
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install isolated test prerequisites
        run: python -m pip install 'pytest>=8,<10'
      - name: Check consent-gated local content search on Windows
        run: python -m pytest -q tests/test_content_index_optin.py tests/test_device_index_first_search_recovery.py
      - name: Exercise SQLite cleanup under real Windows sharing rules
        run: python -m pytest -v tests/test_v2182_sqlite_lifecycle.py -k "selftest_cleanup"
      - name: Validate GitHub ZIP names using actual Windows path semantics
        run: python -m pytest -q tests/test_github_repository_import_v230.py -k "zip_rejects or zip_symlink"
  windows-x64:
    name: Native Windows installer verification
    needs: [frontend-validation, windows-early-regressions]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Fetch and verify the speaker recognition model
        shell: pwsh
        run: |
          $model = 'models/speaker/wespeaker_en_voxceleb_resnet34_LM.onnx'
          $expected = 'e9848563da86f263117134dfd7ad63c92355b37de492b55e325400c9d9c39012'
          if (!(Test-Path $model)) {
            $sources = @(
              'https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx',
              'https://huggingface.co/anujpatel863/Separate/resolve/c9b28337a09ccbf537f811a12ef2ee79b521c881/wespeaker_en_voxceleb_resnet34_LM.onnx'
            )
            foreach ($source in $sources) {
              curl.exe --fail --silent --show-error --location --retry 2 --max-time 120 --output "$model.download" $source
              if ($LASTEXITCODE -eq 0 -and (Get-FileHash "$model.download" -Algorithm SHA256).Hash -eq $expected) {
                Move-Item "$model.download" $model
                break
              }
              Remove-Item "$model.download" -ErrorAction SilentlyContinue
            }
          }
          if (!(Test-Path $model) -or (Get-FileHash $model -Algorithm SHA256).Hash -ne $expected) {
            throw 'Speaker model is missing or its SHA-256 does not match'
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Check Windows policy regression and protected staging paths
        shell: pwsh
        run: |
          py -3.11 -m pip install -r requirements-test.txt
          py -3.11 -m pytest -q tests/test_computer_control_cognition_v230.py -k "anchored_ui_safety_and_approval or staged_appdata_working_directory_stays_protected"
      - name: Build React, run tests, package Windows EXE and perform binary self-test
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify EXACT outputs from THIS run
        shell: pwsh
        run: |
          $releaseVersion = '2.41.0'
          $prefix = "release/BARQ_Setup_$releaseVersion.exe"
          if (!(Test-Path $prefix)) { throw 'Missing freshly built installer' }
          if (!(Test-Path "release/BARQ_Portable_$releaseVersion.zip")) { throw 'Missing portable ZIP' }
          $marker = "release/build-ok-v$releaseVersion.marker"
          if (!(Test-Path $marker)) { throw 'Missing verified build marker' }
          if (-not ((Get-Content $marker -Raw) -match 'fresh-react')) { throw 'Stale or recovery UI blocked' }
          $report = Get-Content 'release/self-test.json' -Raw | ConvertFrom-Json
          $installed = Get-Content 'release/installed-self-test.json' -Raw | ConvertFrom-Json
          if ($installed.status -ne 'ok' -or $installed.version -ne $releaseVersion -or -not $installed.frozen) { throw 'Installed application smoke failed' }
          $evidence = Get-Content 'release/release-evidence.json' -Raw | ConvertFrom-Json
          foreach ($file in @($prefix, "release/BARQ_Portable_$releaseVersion.zip")) {
            $expected = $evidence.sha256.PSObject.Properties[$file].Value
            if ((Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant() -ne $expected) { throw "Artifact checksum mismatch: $file" }
          }
          if ($report.status -ne 'ok' -or $report.ui -ne 'react' -or $report.frozen -ne $true) { throw 'Packaged executable smoke test failed' }
      - name: Package verified BARQ Core and UI incremental update
        shell: pwsh
        run: |
          $compiler = & ./scripts/find_inno.ps1
          if ([string]::IsNullOrWhiteSpace($compiler) -or !(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Inno compiler unavailable for incremental update' }
          if (!(Test-Path 'dist/BARQ/BARQ.exe')) { throw 'Missing newly built executable' }
          if (!(Test-Path 'web/react/index.html')) { throw 'Missing freshly built React UI' }
          & $compiler ./scripts/installer_core_ui_update.iss
          if ($LASTEXITCODE -ne 0) { throw 'Core/React update compilation failed' }
          $patch = 'release/BARQ_Core_UI_Update_2.41.0.exe'
          if (!(Test-Path $patch)) { throw 'Missing Core+UI patch installer' }
          $size = (Get-Item $patch).Length
          if ($size -gt 180MB) { throw "Unexpectedly large update: $size bytes" }
          $checksum = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  BARQ_Core_UI_Update_2.41.0.exe" | Set-Content release/BARQ_Core_UI_Update_2.41.0.sha256 -Encoding ascii
          Write-Host "Core+UI patch built, $size bytes, SHA256 $checksum"
      - name: Upload verified incremental Core+UI update
        uses: actions/upload-artifact@v4
        with:
          name: BARQ-v2.41.0-Core-and-UI-update
          path: |
            release/BARQ_Core_UI_Update_2.41.0.exe
            release/BARQ_Core_UI_Update_2.41.0.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BARQ-v2.41.0-Windows-diagnostics
          path: |
            release/*.log
            release/*.xml
            release/python-tests-failures.txt
            release/*self-test.json
            release/release-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload installer, portable app, and evidence
        id: upload-windows
        uses: actions/upload-artifact@v4
        with:
          name: BARQ-v2.41.0-verified-Windows-x64
          path: |
            release/BARQ_Setup_2.41.0.exe
            release/BARQ_Portable_2.41.0.zip
            release/self-test.json
            release/installed-self-test.json
            release/release-evidence.json
            release/build-ok-v2.41.0.marker
            release/UI_BUILD_MODE.txt
          if-no-files-found: error
          retention-days: 30
      - name: Download the published Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BARQ-v2.41.0-verified-Windows-x64
          path: ${{ runner.temp }}/barq-published-artifact
      - name: Verify the installer in the published artifact
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload-windows.outputs.artifact-url }}
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'barq-published-artifact'
          $filename = 'BARQ_Setup_2.41.0.exe'
          $installer = Get-Item -LiteralPath (Join-Path $folder $filename)
          $evidence = Get-Content -LiteralPath (Join-Path $folder 'release-evidence.json') -Raw | ConvertFrom-Json
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $evidence.sha256.PSObject.Properties["release/$filename"].Value) {
            throw 'The downloaded installer SHA-256 differs from the release evidence'
          }
          $reader = [System.IO.BinaryReader]::new($installer.OpenRead())
          try {
            if ($reader.ReadUInt16() -ne 0x5a4d) { throw 'Installer has no DOS header' }
            $reader.BaseStream.Position = 0x3c
            $reader.BaseStream.Position = $reader.ReadUInt32()
            if ($reader.ReadUInt32() -ne 0x00004550) { throw 'Installer has no Windows PE signature' }
          } finally {
            $reader.Dispose()
          }
          "Verified published installer: $filename ($($installer.Length) bytes), SHA-256 $hash"
          "Installer artifact: $env:ARTIFACT_URL"
